# ── Negociacion de contenido para imagenes (WebP) ─────────────────────────
# Permite servir la variante .webp con LA MISMA URL cuando el navegador la
# acepta, y el PNG/JPG original cuando no. Asi no se cambia ni una linea de la
# app ni las rutas guardadas en la base de datos (productos.imagen).
map $http_accept $webp_suffix {
    default     "";
    "~*webp"    ".webp";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── C4: compresion ────────────────────────────────────────────────────
    # Antes no habia gzip: la landing enviaba ~685 KB sin comprimir en cada
    # visita. Con gzip baja a ~200 KB.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # ── B8: cabeceras de seguridad ────────────────────────────────────────
    # No habia ninguna. Estas son seguras y no requieren cambios en la app.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;
    # HSTS: activar SOLO cuando el sitio ya sirva por HTTPS de forma estable.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── CSP ───────────────────────────────────────────────────────────────
    # Dejada comentada A PROPOSITO: una CSP mal ajustada rompe la app en
    # produccion sin error visible. Esta plantilla cubre lo que la app usa
    # (Supabase REST + websockets de Realtime, Google Fonts, camara para QR).
    # Para activarla: descomentar, desplegar a staging, abrir la consola del
    # navegador y verificar que no haya violaciones en / , /menu , /pos y /admin.
    #
    # add_header Content-Security-Policy "default-src 'self'; \
    #   script-src 'self'; \
    #   style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
    #   font-src 'self' data: https://fonts.gstatic.com; \
    #   img-src 'self' data: blob: https:; \
    #   media-src 'self' blob:; \
    #   connect-src 'self' https://*.supabase.co wss://*.supabase.co; \
    #   frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Evita que nginx agregue el puerto/host equivocado en los 301.
    absolute_redirect off;

    # ── Colision de ruta: /menu ───────────────────────────────────────────
    # public/menu/ es una CARPETA DE IMAGENES, y /menu es tambien una ruta de
    # la SPA (el menu digital que se abre por QR). Con el try_files generico,
    # nginx encontraba el directorio, redirigia 301 a /menu/ y devolvia 403:
    # el menu digital nunca cargaba. Verificado con nginx real el 2026-09-27.
    #
    # No se renombra la carpeta porque las rutas /menu/*.png estan guardadas
    # en la base de datos (productos.imagen) y en el frontend.
    # El match exacto solo afecta a /menu: las imagenes /menu/*.png siguen
    # sirviendose por la regla de assets de abajo.
    location = /menu {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
    location = /menu/ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets de Vite llevan hash en el nombre, por eso el cache inmutable
    # es seguro. index.html NO debe cachearse asi o el navegador se queda con
    # una version vieja apuntando a chunks que ya no existen.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── Imagenes: intenta la variante WebP primero ─────────────────────────
    # try_files sirve <archivo>.webp si existe Y el navegador acepta webp;
    # si no, cae al original. Vary: Accept es obligatorio para que caches y
    # CDNs no sirvan el webp a un navegador que no lo soporta.
    location ~* \.(png|jpe?g)$ {
        add_header Vary "Accept" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri$webp_suffix $uri =404;
    }

    location ~* \.(js|css|gif|ico|svg|woff|woff2|webp)$ {
        # Sin `expires 1y`: emitia su propio Cache-Control y quedaban DOS
        # cabeceras Cache-Control en la respuesta. Verificado en la prueba.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
